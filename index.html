<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b08" />
    <link rel="icon" href="data:," />
    <title>币塔街机 · 网页推币机</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="推币机游戏画面"></canvas>
      <div id="climax-flash" aria-hidden="true"></div>

      <section id="hud" aria-live="polite">
        <header id="hud-top">
          <div class="hud-chip" id="level-chip">
            <span class="hud-label">本局</span>
            <strong id="level-label">无尽 · xixi 大王大赏</strong>
          </div>

          <div id="earned-block">
            <span class="hud-label">本局赚进</span>
            <strong id="earned-value">0</strong>
            <span class="hud-label">最高 <strong id="best-value">0</strong></span>
            <!-- ★ S4 合并账户：这里原本还有一条「钱包 <strong id="wallet-value">」。
                 合并之后「钱包」与底部的「局内筹码」是同一个数 ⇒ 并成底部那一条。
                 留两个读数显示同一个值，就是玩家抱怨「我的钱怎么少了 20」的源头。 -->
          </div>

          <div id="hud-actions">
            <button id="pause-button" type="button">暂停</button>
            <button id="collection-button" type="button">图鉴</button>
          </div>
        </header>

        <!--
          XIXI 集章：四槽的亮灭**已经画在 3D 模型里**（推板前缘的四段内嵌标牌，
          见 `Pusher.buildXixiLanes`），所以这里只留一行进度文字，
          不再重复四个 DOM 圆点 —— 两套同样的东西叠在同一处屏幕上只会互相打架。
        -->
        <div id="xixi-marks" aria-label="XIXI 集章状态">
          <span id="mark-note">投币点亮 XIXI 四槽，集齐摇老虎机</span>
        </div>
        <!-- 欠款一行小字（S2）。刻意独立成一条而不是塞进 `mark-note`：
             那条已经兼作「加力已就绪」的提示位，两种语义挤在一起会让 HUD 说出矛盾的话。 -->
        <div id="debt-line" hidden aria-live="polite">
          <span id="debt-note"></span>
        </div>

        <div id="combo-toast" role="status" aria-live="polite"></div>
        <div id="drain-prompt" hidden>
          <p>收尾阶段：仍持有加力。使用它，或放弃并结算。</p>
          <button id="giveup-button" type="button">放弃加力并结算</button>
        </div>
        <div id="status-line">左右自动选位，轻点机台投币</div>

        <footer id="hud-bottom">
          <div id="resource-readout">
            <span class="hud-label">余额</span>
            <strong id="credits-value">0</strong>
          </div>
          <div id="action-column">
            <div id="mechanism-row">
              <button id="sweeper-button" type="button">
                <span>扫板</span>
                <small id="sweeper-state">收尾可用</small>
              </button>
              <button id="grapple-button" type="button">
                <span>抓斗</span>
                <small id="grapple-state">剩 2 次 · 花 2 筹码</small>
              </button>
              <button id="reload-button" type="button">
                <span>后装填</span>
                <small id="reload-state">花 1 筹码 · 注入 3 枚</small>
              </button>
              <button id="bet-button" type="button">
                <span>加注</span>
                <small id="bet-state">1 投 · ×1</small>
              </button>
            </div>
            <div id="action-row">
              <button id="boost-button" type="button" disabled hidden>
                <span>加力</span>
                <small id="boost-state">未充能</small>
              </button>
              <button id="drop-button" type="button">
                <span>投币</span>
                <small id="drop-state">普通铜币</small>
              </button>
            </div>
          </div>
        </footer>
      </section>

      <section id="pause-panel" hidden>
        <h2>已暂停</h2>
        <p>推板与物理都已冻结，恢复后不会补算暂停时间。</p>
        <button id="resume-button" type="button">继续</button>
        <button id="quality-lock-button" type="button" aria-pressed="false">画质：自动（当前 高）</button>
        <p class="pause-note">帧率偏低时画面会自动降档；锁上之后就不再自动换。</p>
      </section>

      <section id="collection-panel" hidden>
        <header>
          <h2>图鉴</h2>
          <span id="ticket-count">筹码 0</span>
          <button id="collection-close" type="button">关闭</button>
        </header>
        <p class="collection-note">
          外观只改币纹与机柜配色，不影响返值、投币消耗与推板行程。
        </p>
        <h3>币纹</h3>
        <div id="coin-skin-list" class="skin-list"></div>
        <h3>机柜配色</h3>
        <div id="cabinet-skin-list" class="skin-list"></div>
      </section>

            <!-- 破产弹窗：无尽模式的核心产出，不是失败惩罚。 -->
      <section id="ruin-panel" hidden>
        <h2 id="ruin-title">破产</h2>
        <p id="ruin-taunt"></p>
        <dl id="ruin-stats"></dl>
        <p id="ruin-board"></p>
        <div id="ruin-actions">
          <button id="loan-button" type="button">贷款续玩</button>
          <button id="beg-button" type="button">跪求 xixi 大王大赏</button>
          <button id="quit-button" type="button">保留尊严，收工</button>
        </div>
      </section>
      <!-- 波间三选一（1c）：攒够本波票券之后立起来的一张选卡面板。
           **不是破产窗**：语义上它是奖励，样式上刻意不复用 #ruin-panel 的规则，
           但用同一套面板语言（硬边、铭牌、按钮），所以它看起来是同一台机器上的东西。 -->
      <section id="draft-panel" hidden>
        <h2 id="draft-title">波间三选一</h2>
        <p id="draft-meta"></p>
        <div id="draft-choices"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
